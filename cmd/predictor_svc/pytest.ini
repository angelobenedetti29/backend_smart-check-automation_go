[pytest]
# El repo tiene un paquete `cmd/` (cmd/__init__.py) que colisiona con el módulo
# estándar `cmd` de Python cuando pytest deriva el nombre de módulo del test
# (`cmd.predictor_svc.tests.test_predict`). El modo importlib importa los tests
# por ruta de archivo, sin exigir esa cadena de paquetes.
addopts = --import-mode=importlib
