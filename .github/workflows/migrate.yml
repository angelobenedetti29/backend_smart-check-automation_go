name: Migrate & Deploy

on:
  push:
    branches:
      - staging
      - main

jobs:
  migrate-and-deploy:
    name: Migrate DB then Deploy
    runs-on: ubuntu-latest

    # Resuelve al GitHub Environment "staging" o "production" según la rama.
    # Cada environment tiene sus propios secrets: DATABASE_URL y RENDER_DEPLOY_HOOK.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Aplica schema.sql (instalación limpia) y las migraciones pendientes de
      # database/migrations. El runner registra cada versión en schema_migrations.
      - name: Apply schema and migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --silent --fail --show-error -X POST "$DEPLOY_HOOK"
