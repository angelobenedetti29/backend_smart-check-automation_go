services:
  # ── Staging ────────────────────────────────────────────────────────────────
  - type: web
    name: smartcheck-backend-staging
    runtime: docker
    branch: staging
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # El deploy lo dispara el workflow de GitHub Actions (migrate.yml) después
    # de correr las migraciones. Render NO deploya automáticamente al push.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        # Supabase PostgreSQL 16 (puerto 5432). No usar un pooler de transacciones.
        # Ver DEPLOY.md.
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGINS
        # Orígenes explícitos del panel (CORS), separados por coma.
        sync: false
      - key: PREDICTOR_URL
        sync: false
      - key: PREDICTOR_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICACIONES_EMAIL_FROM
        sync: false
      - key: NOTIFICACIONES_EMAIL_PROVIDER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NOTIFICACIONES_PANEL_URL
        sync: false
      - key: TELEMETRIA_MONITOR_INTERVALO
        value: 15s
      - key: TELEMETRIA_DESACTUALIZADA_SEGUNDOS
        value: 30s
      - key: PORT
        value: "8080"

  # ── Production ─────────────────────────────────────────────────────────────
  - type: web
    name: smartcheck-backend-prod
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        # Supabase PostgreSQL 16 (puerto 5432).
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGINS
        # Orígenes explícitos del panel (CORS), separados por coma.
        sync: false
      - key: PREDICTOR_URL
        sync: false
      - key: PREDICTOR_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICACIONES_EMAIL_FROM
        sync: false
      - key: NOTIFICACIONES_EMAIL_PROVIDER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NOTIFICACIONES_PANEL_URL
        sync: false
      - key: TELEMETRIA_MONITOR_INTERVALO
        value: 15s
      - key: TELEMETRIA_DESACTUALIZADA_SEGUNDOS
        value: 30s
      - key: PORT
        value: "8080"
