services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
      predictor-svc:
        condition: service_started

  # Sidecar predictor XGBoost per-producto (SCA-400). El backend Go lo
  # llama por HTTP en cada decisión del MPC. Los artefactos entrenados se
  # persisten en el volumen predictor_models para sobrevivir reinicios.
  predictor-svc:
    build:
      context: .
      dockerfile: cmd/predictor-svc/Dockerfile
    ports:
      - "8090:8090"
    environment:
      # El predictor no toca la BD directamente; el trainer (run fuera del
      # contenedor) usa DATABASE_URL. Mantener el puerto fijo por
      # contrato del backend (PREDICTOR_URL=http://predictor-svc:8090).
      - PYTHONUNBUFFERED=1
    volumes:
      - predictor_models:/app/models_xgb
    restart: unless-stopped

volumes:
  postgres_data:
  predictor_models: